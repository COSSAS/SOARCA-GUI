services:
  soarca-gui:
    container_name: soarca-gui
    image: cossas/soarca-gui:${SOARCA_GUI_VERSION:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-development}
    ports:
      - "${DOCKER_HOST_PORT:-8081}:${NGINX_SERVER_PORT:-8081}"
    volumes:
      - soarca-certs:/app/certs:ro
    environment:
      - NODE_ENV=production
      - NGINX_BACKEND_URL=${NGINX_BACKEND_URL:-https://host.docker.internal:8080/}
      - NGINX_SERVER_PORT=${NGINX_SERVER_PORT:-8081}
      - NGINX_CERT_FILE=${NGINX_CERT_FILE:-/app/certs/server.crt}
      - NGINX_CERT_KEY_FILE=${NGINX_CERT_KEY_FILE:-/app/certs/server.key}
      - NGINX_PROXY_SSL_VERIFY=${NGINX_PROXY_SSL_VERIFY:-off}
    restart: unless-stopped

volumes:
  soarca-certs:
    external: true
    name: ${SOARCA_CERTS_VOLUME:-soarca_certs_data_container}
