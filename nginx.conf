# Nginx template: variables are substituted at container start (envsubst)
# Variables expected:
#   - ${NGINX_SERVER_PORT} (default: 8081): port nginx will listen on inside the container
#   - ${NGINX_BACKEND_URL} (default: https://host.docker.internal:8080/): backend to proxy /api/ to (include trailing slash)
#   - ${NGINX_CERT_FILE} (default: /app/certs/server.crt): TLS certificate file
#   - ${NGINX_CERT_KEY_FILE} (default: /app/certs/server.key): TLS certificate key file
#   - ${NGINX_PROXY_SSL_VERIFY} (default: off): verify the backend TLS certificate
server {
    listen       ${NGINX_SERVER_PORT} ssl;
    server_name  localhost;

    ssl_certificate     ${NGINX_CERT_FILE};
    ssl_certificate_key ${NGINX_CERT_KEY_FILE};
    ssl_protocols       TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_ssl_verify ${NGINX_PROXY_SSL_VERIFY};
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}